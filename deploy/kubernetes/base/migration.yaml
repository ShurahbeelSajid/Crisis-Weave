apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crisisweave-migration
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: crisisweave-secret-store
  target:
    name: crisisweave-migration-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: crisisweave/production/migration
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crisisweave-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crisisweave-migration
        crisisweave.io/egress-class: migration
    spec:
      serviceAccountName: crisisweave-migration
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: REPLACE_WITH_IMMUTABLE_API_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: crisisweave-runtime
            - configMapRef:
                name: crisisweave-migration-config
            - secretRef:
                name: crisisweave-migration-runtime
          env:
            - name: CRISISWEAVE_RUNTIME_ROLE
              value: migration
            - name: CRISISWEAVE_AUTH_MODE
              value: api_key
            - name: CRISISWEAVE_API_KEYS
              value: ""
            - name: CRISISWEAVE_TRUST_PROXY_HEADERS
              value: "false"
            - name: CRISISWEAVE_PROVIDER_CANARY_ON_STARTUP
              value: "false"
            - name: CRISISWEAVE_POSTGRES_RLS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
