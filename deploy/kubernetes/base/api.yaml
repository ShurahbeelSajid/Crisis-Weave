apiVersion: apps/v1
kind: Deployment
metadata:
  name: crisisweave-api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crisisweave-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crisisweave-api
        crisisweave.io/egress-class: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: crisisweave-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crisisweave-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crisisweave-api
      initContainers:
        - name: wait-for-migration
          image: REPLACE_WITH_IMMUTABLE_API_IMAGE
          args: ["doctor"]
          envFrom:
            - configMapRef:
                name: crisisweave-runtime
            - configMapRef:
                name: crisisweave-api-config
            - secretRef:
                name: crisisweave-api-runtime
          env:
            - name: CRISISWEAVE_RUNTIME_ROLE
              value: api
            - name: CRISISWEAVE_AUTH_MODE
              value: oidc
            - name: CRISISWEAVE_TRUST_PROXY_HEADERS
              value: "true"
            - name: CRISISWEAVE_OVERSIGHT_ENABLED
              value: "true"
            - name: CRISISWEAVE_POSTGRES_RLS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      containers:
        - name: api
          image: REPLACE_WITH_IMMUTABLE_API_IMAGE
          args: ["serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: crisisweave-runtime
            - configMapRef:
                name: crisisweave-api-config
            - secretRef:
                name: crisisweave-api-runtime
          env:
            - name: CRISISWEAVE_RUNTIME_ROLE
              value: api
            - name: CRISISWEAVE_AUTH_MODE
              value: oidc
            - name: CRISISWEAVE_TRUST_PROXY_HEADERS
              value: "true"
            - name: CRISISWEAVE_OVERSIGHT_ENABLED
              value: "true"
            - name: CRISISWEAVE_POSTGRES_RLS_ENABLED
              value: "true"
            - name: CRISISWEAVE_OTEL_SERVICE_NAME
              value: crisisweave-api
            - name: CRISISWEAVE_OTEL_EXPORTER_CA_FILE
              value: /otel-ca/ca.crt
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: api
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
            - name: otel-ca
              mountPath: /otel-ca
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: otel-ca
          configMap:
            name: crisisweave-internal-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: crisisweave-api
  labels:
    app.kubernetes.io/name: crisisweave-api
spec:
  selector:
    app.kubernetes.io/name: crisisweave-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crisisweave-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crisisweave-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crisisweave-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crisisweave-api
