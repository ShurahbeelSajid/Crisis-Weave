apiVersion: apps/v1
kind: Deployment
metadata:
  name: crisisweave-worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crisisweave-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crisisweave-worker
        crisisweave.io/egress-class: worker
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: crisisweave-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crisisweave-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crisisweave-worker
      containers:
        - name: worker
          image: REPLACE_WITH_IMMUTABLE_API_IMAGE
          args: ["ingestion-worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: crisisweave-runtime
            - configMapRef:
                name: crisisweave-worker-config
            - secretRef:
                name: crisisweave-worker-runtime
          env:
            - name: CRISISWEAVE_RUNTIME_ROLE
              value: ingestion_worker
            - name: CRISISWEAVE_AUTH_MODE
              value: api_key
            - name: CRISISWEAVE_API_KEYS
              value: ""
            - name: CRISISWEAVE_TRUST_PROXY_HEADERS
              value: "false"
            - name: CRISISWEAVE_PROVIDER_CANARY_ON_STARTUP
              value: "false"
            - name: CRISISWEAVE_POSTGRES_RLS_ENABLED
              value: "true"
            - name: CRISISWEAVE_PARSER_SERVICE_URL
              value: http://crisisweave-parser:8001
            - name: CRISISWEAVE_OTEL_SERVICE_NAME
              value: crisisweave-worker
            - name: CRISISWEAVE_OTEL_EXPORTER_CA_FILE
              value: /otel-ca/ca.crt
            - name: CRISISWEAVE_WORKER_METRICS_HOST
              value: 0.0.0.0
            - name: CRISISWEAVE_WORKER_METRICS_PORT
              value: "9100"
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: worker-data
              mountPath: /data
            - name: worker-tmp
              mountPath: /tmp
            - name: otel-ca
              mountPath: /otel-ca
              readOnly: true
      volumes:
        - name: worker-data
          emptyDir:
            sizeLimit: 4Gi
        - name: worker-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: otel-ca
          configMap:
            name: crisisweave-internal-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: crisisweave-worker-metrics
  labels:
    app.kubernetes.io/name: crisisweave-worker
spec:
  selector:
    app.kubernetes.io/name: crisisweave-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crisisweave-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crisisweave-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crisisweave-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crisisweave-worker
