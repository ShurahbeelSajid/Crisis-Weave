  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              crisisweave.io/network-role: migration-egress-gateway
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-egress
spec:
  podSelector:
    matchLabels:
      crisisweave.io/egress-class: telemetry
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              crisisweave.io/network-role: observability-egress-gateway
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-egress
spec:
  podSelector:
    matchLabels:
      crisisweave.io/egress-class: ui
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: crisisweave-api
      ports:
        - protocol: TCP
          port: 8000
